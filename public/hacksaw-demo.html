<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hacksaw Gaming</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080808;color:#eee;font:14px Arial,sans-serif}
    iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
    #status{position:absolute;inset:0;display:flex;flex-direction:column;gap:16px;align-items:center;justify-content:center;background:#080808}
    #status[hidden]{display:none}button{padding:12px 24px;border:0;border-radius:8px;background:#e8bf60;color:#211705;font:700 14px Arial;cursor:pointer}
  </style>
  <script type="module" src="hacksaw-demo.js"></script>
</head>
<body>
  <iframe id="provider-game" title="Hacksaw Gaming" allow="autoplay; fullscreen" allowfullscreen></iframe>
  <div id="status" role="status"><span id="status-copy">Loading game…</span><button id="retry" type="button" hidden>Try again</button></div>
</body>
</html>
