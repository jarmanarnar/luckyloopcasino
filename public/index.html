<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="application-name" content="LuckyLoop Casino">
  <meta name="description" content="LuckyLoop Casino — a casino lobby prototype with provider catalogs, game collections, and a two-currency demo wallet.">
  <title>LuckyLoop Casino</title>
  <link rel="preload" href="assets/fonts/arimo-bold-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="wallet.css">
  <link rel="stylesheet" href="site-menu.css">
  <link rel="stylesheet" href="mobile-nav.css">
  <link rel="stylesheet" href="hero-carousel.css">
  <link rel="stylesheet" href="catalog-pages.css">
  <link rel="stylesheet" href="store.css">
  <link rel="stylesheet" href="feature-pages.css">
  <link rel="stylesheet" href="game-details.css">
  <link rel="stylesheet" href="how-to-play.css">
</head>
<body data-sidebar="collapsed" data-app-state="loading" data-app-starting="true">
  <div id="app-loader" class="app-loader" role="status" aria-live="polite" lang="en" dir="ltr">
    <img src="assets/loop-wireframe-v1.png" width="1916" height="821" alt="LOOP">
    <span class="app-loader__spinner" aria-hidden="true"></span>
    <p id="app-load-status" class="visually-hidden">Loading LuckyLoop Casino…</p>
    <button id="app-load-retry" class="app-loader__retry" type="button" hidden>Try again</button>
    <noscript><p>Enable JavaScript to load the site.</p></noscript>
  </div>
  <aside id="site-sidebar" class="site-sidebar" aria-label="Casino sidebar" lang="en" dir="ltr" hidden>
    <div id="sidebar-header" class="site-sidebar__header"></div>
    <div id="sidebar-content" class="site-sidebar__content"></div>
  </aside>
  <header class="top-bar" aria-label="בר עליון">
    <div class="top-bar__inner" lang="en" dir="ltr">
      <div class="header-context">
        <button class="icon-button menu-toggle" id="menu-toggle" type="button" aria-label="Open menu" aria-haspopup="dialog" aria-expanded="false" aria-controls="site-menu">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="3" y="5" width="18" height="3" rx="1.5"/><rect x="3" y="10.5" width="18" height="3" rx="1.5"/><rect x="3" y="16" width="18" height="3" rx="1.5"/></svg>
        </button>
        <a class="site-logo" href="#" aria-label="LuckyLoop Casino home"><img class="site-logo__image" src="assets/loop-wireframe-v1.png" width="1916" height="821" alt="LOOP"></a>
      </div>
      <div id="coin-wallet" class="coin-wallet" data-currency="GC" aria-label="Demo wallet" role="group">
        <span class="wallet-balance-copy"><span id="wallet-currency-label">GC</span><strong id="wallet-balance-value">125,000</strong></span>
        <button id="wallet-add" class="icon-button" type="button" aria-label="Open Store" aria-controls="store-view"><img id="wallet-add-art" src="assets/coins/add-gold.svg" width="48" height="48" alt="" aria-hidden="true"></button>
      </div>
      <button id="coin-type-switch" class="wallet-switch" type="button" role="switch" aria-label="Use Sweeps Coins" aria-checked="false"><img id="currency-coin" class="coin-art" src="assets/coins/gold-coin.svg" width="36" height="36" alt="" aria-hidden="true"></button>
    </div>
  </header>
  <main class="page-content" id="lobby-view">
    <section class="hero-carousel" id="hero-carousel" role="region" aria-roledescription="carousel" aria-label="Featured promotions" lang="en" dir="ltr">
      <div class="hero-carousel__viewport" id="hero-viewport" tabindex="0" aria-label="Promotional banners" aria-live="off">
        <div class="hero-carousel__track" id="hero-track">
          <article class="hero-carousel__slide" data-hero-title="Banner 1" role="group" aria-roledescription="slide" aria-label="1 of 4: Banner 1">
            <div class="hero-banner" aria-hidden="true"></div>
          </article>
          <article class="hero-carousel__slide" data-hero-title="Banner 2" role="group" aria-roledescription="slide" aria-label="2 of 4: Banner 2">
            <div class="hero-banner" aria-hidden="true"></div>
          </article>
          <article class="hero-carousel__slide" data-hero-title="Banner 3" role="group" aria-roledescription="slide" aria-label="3 of 4: Banner 3">
            <div class="hero-banner" aria-hidden="true"></div>
          </article>
          <article class="hero-carousel__slide" data-hero-title="Banner 4" role="group" aria-roledescription="slide" aria-label="4 of 4: Banner 4">
            <div class="hero-banner" aria-hidden="true"></div>
          </article>
        </div>
      </div>
      <div class="hero-carousel__controls" id="hero-controls" hidden>
        <div class="hero-carousel__dots" id="hero-dots" role="group" aria-label="Choose a promotion"></div>
      </div>
      <p class="visually-hidden" id="hero-status" aria-live="polite" aria-atomic="true"></p>
    </section>
    <section class="catalog-toolbar" aria-label="Game filters" lang="en" dir="ltr">
      <div class="catalog-category-rail">
        <nav id="catalog-categories" class="catalog-categories" aria-label="Game types and categories"></nav>
        <button id="catalog-category-previous" class="catalog-category-arrow catalog-category-arrow--previous" type="button" aria-label="Previous game categories" aria-controls="catalog-categories" disabled hidden><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M15.7 4.3a1 1 0 0 1 0 1.4L9.4 12l6.3 6.3a1 1 0 0 1-1.4 1.4l-7-7a1 1 0 0 1 0-1.4l7-7a1 1 0 0 1 1.4 0Z"/></svg></button>
        <button id="catalog-category-next" class="catalog-category-arrow catalog-category-arrow--next" type="button" aria-label="Next game categories" aria-controls="catalog-categories" disabled hidden><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M15.7 4.3a1 1 0 0 1 0 1.4L9.4 12l6.3 6.3a1 1 0 0 1-1.4 1.4l-7-7a1 1 0 0 1 0-1.4l7-7a1 1 0 0 1 1.4 0Z" transform="translate(24 0) scale(-1 1)"/></svg></button>
      </div>
    </section>
    <header id="catalog-page-header" class="catalog-page-header" lang="en" dir="ltr" hidden>
      <button id="catalog-page-back" class="catalog-page-back icon-button" type="button" aria-label="Back to lobby"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m15 4-8 8 8 8 1.4-1.4L9.8 12l6.6-6.6L15 4Z"/></svg></button>
      <h1 id="catalog-page-title" tabindex="-1"></h1>
    </header>
    <div id="catalog-page-controls" class="catalog-page-controls" lang="en" dir="ltr" hidden>
      <form id="catalog-page-search-form" class="catalog-page-search" role="search">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M10.5 2a8.5 8.5 0 1 0 5.26 15.17l4.53 4.54 1.42-1.42-4.54-4.53A8.5 8.5 0 0 0 10.5 2Zm0 2a6.5 6.5 0 1 1 0 13 6.5 6.5 0 0 1 0-13Z"/></svg>
        <input id="catalog-page-search-input" type="search" placeholder="Search games" aria-label="Search games" autocomplete="off">
      </form>
      <label class="catalog-page-filter"><span class="visually-hidden">Game category</span><select id="catalog-page-category" aria-label="Game category"></select></label>
      <label class="catalog-page-filter"><span class="visually-hidden">Game provider</span><select id="catalog-page-provider" aria-label="Game provider"></select></label>
      <label class="catalog-page-filter"><span class="visually-hidden">Sort games</span><select id="catalog-page-sort" aria-label="Sort games"></select></label>
    </div>
    <div id="catalog-shelves" class="catalog-shelves" lang="en" dir="ltr"></div>
    <p id="catalog-empty" class="catalog-empty" role="status" lang="en" dir="ltr" hidden>No games found. Try another search, category or provider.</p>
    <div id="catalog-pagination" class="catalog-pagination" lang="en" dir="ltr" hidden><p id="catalog-page-count" role="status"></p><button id="catalog-more" class="text-control" type="button" hidden>Show more</button></div>
    <section id="catalog-provider-details" class="catalog-provider-details" lang="en" dir="ltr" hidden></section>
  </main>
  <main class="game-view" id="game-view" aria-label="Game demo" tabindex="-1" lang="en" dir="ltr" hidden>
    <div class="game-frame-host" id="game-frame-host"></div>
    <div class="game-loading" id="game-loading" hidden>
      <div class="game-loading__content">
        <p class="game-load-status" id="game-load-status" role="status" aria-live="polite">Loading game…</p>
        <button class="game-loading__reveal" id="game-loading-reveal" type="button" hidden>Show game window</button>
      </div>
    </div>
  </main>
  <main id="game-details-view" class="page-content game-details-view" lang="en" dir="ltr" hidden></main>
  <nav id="mobile-nav" class="mobile-nav" aria-label="Mobile navigation" lang="en" dir="ltr" hidden>
    <button id="mobile-nav-menu" class="mobile-nav__item" data-mobile-action="menu" type="button" aria-haspopup="dialog" aria-controls="site-menu" aria-expanded="false"><svg class="mobile-nav__icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false"><rect x="3" y="5" width="18" height="3" rx="1.5"/><rect x="3" y="10.5" width="18" height="3" rx="1.5"/><rect x="3" y="16" width="18" height="3" rx="1.5"/></svg><span class="mobile-nav__label">Menu</span></button>
    <button id="mobile-nav-store" class="mobile-nav__item" data-mobile-action="store" type="button" aria-controls="store-view"><svg class="mobile-nav__icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false"><path fill-rule="evenodd" d="M20 4H4v2h16V4Zm1 10v-2l-1-5H4l-1 5v2h1v6h10v-6h4v6h2v-6h1Zm-9 4H6v-4h6v4Z"/></svg><span class="mobile-nav__label">Store</span></button>
    <button id="mobile-nav-lobby" class="mobile-nav__item" data-mobile-action="lobby" type="button" aria-controls="lobby-view"><svg class="mobile-nav__icon mobile-nav__icon--loop" viewBox="542 216 782 373" fill="currentColor" aria-hidden="true" focusable="false"><defs><mask id="mobile-lobby-loop" maskUnits="userSpaceOnUse" x="542" y="216" width="782" height="373" style="mask-type:luminance"><image href="assets/loop-wireframe-v1.png" width="1916" height="821"/></mask></defs><rect x="542" y="216" width="782" height="373" mask="url(#mobile-lobby-loop)"/></svg><span class="mobile-nav__label">Lobby</span></button>
    <button id="mobile-nav-redeem" class="mobile-nav__item" data-mobile-action="redeem" type="button" aria-controls="feature-view"><svg class="mobile-nav__icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false"><path fill-rule="evenodd" d="M4 3h16a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Zm0 3v3h16V6H4Zm8 5-5 4h3v4h4v-4h3l-5-4Z"/></svg><span class="mobile-nav__label">Redeem</span></button>
    <button id="mobile-nav-profile" class="mobile-nav__item" data-mobile-action="profile" type="button" aria-controls="feature-view"><svg class="mobile-nav__icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false"><path fill-rule="evenodd" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm0 4a3 3 0 1 1 0 6 3 3 0 0 1 0-6Zm-6 12a6 6 0 0 1 12 0H6Z"/></svg><span class="mobile-nav__label">Profile</span></button>
  </nav>
  <dialog id="site-menu" class="site-menu" aria-label="Casino menu" lang="en" dir="ltr">
    <div id="menu-mobile-header" class="site-menu__mobile-header">
      <div id="menu-shortcuts" class="site-menu__shortcuts">
        <button id="menu-buy" class="site-menu__shortcut site-menu__shortcut--buy" type="button" aria-label="BUY" data-tooltip="BUY"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M20 4H4v2h16V4Zm1 10v-2l-1-5H4l-1 5v2h1v6h10v-6h4v6h2v-6h1Zm-9 4H6v-4h6v4Z"/></svg><span class="site-menu__shortcut-label">BUY</span></button>
        <button id="menu-redeem" class="site-menu__shortcut" type="button" aria-label="REDEEM" data-tooltip="REDEEM" disabled><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M5 4h14a2 2 0 0 1 2 2v13H3V6a2 2 0 0 1 2-2Zm1 3v3h12V7H6Zm2 6H6v3h2v-3Zm5 0h-2v3h2v-3Zm5 0h-2v3h2v-3Z"/></svg><span class="site-menu__shortcut-label">REDEEM</span></button>
      </div>
    </div>
    <div id="menu-content" class="site-menu__scroll">
      <button id="menu-search" class="site-menu__search" type="button" aria-label="Search games" data-tooltip="Search" aria-controls="lobby-view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><span class="site-menu__label">Search</span></button>
      <button id="menu-daily-bonus" class="site-menu__daily" type="button" aria-label="Daily Bonus" data-tooltip="Daily Bonus" aria-controls="feature-view">
        <span class="site-menu__daily-art" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none"><path d="M8 24h32v18H8z" fill="currentColor" opacity=".3"/><path d="M5 17h38v10H5z" fill="currentColor"/><path d="M21 17h6v25h-6z" fill="currentColor"/><path d="M24 17C9 17 9 5 16 6c5 0 8 11 8 11Zm0 0C39 17 39 5 32 6c-5 0-8 11-8 11Z" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/></svg></span>
        <span class="site-menu__daily-copy"><strong id="menu-daily-amount">1,000 GC</strong><span>Daily Bonus</span></span>
        <span id="menu-daily-badge" class="site-menu__daily-badge">Ready</span>
      </button>
      <nav id="menu-navigation" class="site-menu__navigation" aria-label="Casino navigation"></nav>
    </div>
  </dialog>
  <div id="menu-tooltip" class="site-menu__tooltip" role="tooltip" hidden></div>
  <main id="store-view" class="page-content store-view" lang="en" dir="ltr" hidden>
    <header class="store-header">
      <div class="store-heading"><h1 tabindex="-1">Store</h1></div>
    </header>
    <ul id="store-packages" class="store-packages" aria-label="Gold Coins packages"></ul>
    <dialog id="store-package-dialog" class="store-package-dialog" aria-labelledby="store-package-title" aria-describedby="store-package-note">
      <form method="dialog"><header><h2 id="store-package-title">Package details</h2><button class="store-package-close icon-button" type="submit" aria-label="Close package details"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.4 4.8 12 10.4l5.6-5.6 1.6 1.6L13.6 12l5.6 5.6-1.6 1.6L12 13.6l-5.6 5.6-1.6-1.6L10.4 12 4.8 6.4Z"/></svg></button></header></form>
      <div id="store-package-details"></div>
      <p id="store-package-note" class="store-preview-note">Package preview only. Purchases are not available yet.</p>
    </dialog>
  </main>
  <main id="feature-view" class="page-content feature-view" lang="en" dir="ltr" hidden>
    <header id="feature-header" class="feature-header">
      <button id="feature-back" class="icon-button feature-back" type="button" aria-label="Back to lobby"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m15 4-8 8 8 8 1.4-1.4L9.8 12l6.6-6.6L15 4Z"/></svg></button>
      <div><h1 id="feature-title" tabindex="-1"></h1></div>
    </header>
    <div id="feature-content"></div>
    <p id="feature-status" class="feature-status" role="status" aria-live="polite" aria-atomic="true"></p>
  </main>
  <dialog id="how-to-play-dialog" class="how-to-play-dialog" aria-labelledby="how-to-play-title" aria-describedby="how-to-play-description" lang="en" dir="ltr">
    <button id="how-to-play-close" class="how-to-play-close icon-button" type="button" aria-label="Close How to Play" autofocus><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m6.4 4.8 5.6 5.6 5.6-5.6 1.6 1.6-5.6 5.6 5.6 5.6-1.6 1.6-5.6-5.6-5.6 5.6-1.6-1.6 5.6-5.6-5.6-5.6Z"/></svg></button>
    <h2 id="how-to-play-title">How to Play?</h2>
    <p id="how-to-play-mode" class="how-to-play-mode"></p>
    <div class="how-to-play-stage">
      <button id="how-to-play-previous" class="how-to-play-arrow how-to-play-arrow--previous icon-button" type="button" aria-label="Previous explanation"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m15 4-8 8 8 8"/></svg></button>
      <div id="how-to-play-art" class="how-to-play-art" aria-hidden="true"></div>
      <button id="how-to-play-next" class="how-to-play-arrow how-to-play-arrow--next icon-button" type="button" aria-label="Next explanation"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m9 4 8 8-8 8"/></svg></button>
    </div>
    <p id="how-to-play-description" class="how-to-play-description" aria-live="polite" aria-atomic="true"></p>
    <button id="how-to-play-finish" class="how-to-play-finish" type="button" hidden>Back to Lobby</button>
    <p id="how-to-play-step" class="visually-hidden" role="status"></p>
  </dialog>
  <script type="module" src="bootstrap.js"></script>
</body>
</html>
