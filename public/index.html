<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="application-name" content="LuckyLoop Casino">
  <meta name="description" content="LuckyLoop Casino — a casino lobby prototype with provider catalogs, game collections, and a two-currency demo wallet.">
  <title>LuckyLoop Casino</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="wallet.css">
</head>
<body>
  <header class="top-bar" aria-label="בר עליון">
    <div class="top-bar__inner" lang="en" dir="ltr">
      <div class="header-context">
        <button class="icon-button game-back" id="back-to-lobby" type="button" aria-label="Back to lobby" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg>
        </button>
      </div>
      <div id="coin-wallet" class="coin-wallet" data-currency="GC" aria-label="Demo wallet" role="group">
        <button id="wallet-balance-button" class="wallet-balance-button" type="button" aria-label="Open demo wallet" aria-haspopup="dialog" aria-expanded="false" aria-controls="wallet-dialog"><span id="wallet-currency-label">GC</span><strong id="wallet-balance-value">125,000</strong></button>
        <button id="wallet-add" class="icon-button" type="button" aria-label="Add demo coins" aria-haspopup="dialog" aria-expanded="false" aria-controls="wallet-dialog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
      </div>
      <div id="coin-type-switch" class="wallet-switch" role="group" aria-label="Coin type">
        <button id="currency-gc" class="wallet-currency" type="button" data-wallet-currency="GC" aria-label="Gold Coins" aria-pressed="true"><span class="coin-badge coin-badge--gc" aria-hidden="true">G</span></button>
        <button id="currency-sc" class="wallet-currency" type="button" data-wallet-currency="SC" aria-label="Sweep Coins" aria-pressed="false"><span class="coin-badge coin-badge--sc" aria-hidden="true">S</span></button>
      </div>
    </div>
  </header>
  <main class="page-content" id="lobby-view">
    <section class="hero" aria-label="מקום לתמונת הירו"></section>
    <section class="promo-rail" aria-label="מבצעים ואירועים">
      <ul class="promo-rail__list">
        <li class="promo-shortcut">
          <span class="promo-shortcut__art" aria-hidden="true"></span>
          <span class="promo-shortcut__label">Promo 01</span>
        </li>
        <li class="promo-shortcut">
          <span class="promo-shortcut__art" aria-hidden="true"></span>
          <span class="promo-shortcut__label">Promo 02</span>
        </li>
        <li class="promo-shortcut">
          <span class="promo-shortcut__art" aria-hidden="true"></span>
          <span class="promo-shortcut__label">Promo 03</span>
        </li>
        <li class="promo-shortcut">
          <span class="promo-shortcut__art" aria-hidden="true"></span>
          <span class="promo-shortcut__label">Promo 04</span>
        </li>
        <li class="promo-shortcut">
          <span class="promo-shortcut__art" aria-hidden="true"></span>
          <span class="promo-shortcut__label">Promo 05</span>
        </li>
        <li class="promo-shortcut">
          <span class="promo-shortcut__art" aria-hidden="true"></span>
          <span class="promo-shortcut__label">Promo 06</span>
        </li>
      </ul>
    </section>
    <section class="catalog-toolbar" aria-label="Game filters" lang="en" dir="ltr">
      <div class="catalog-category-rail">
        <nav id="catalog-categories" class="catalog-categories" aria-label="Game types and categories"></nav>
        <button id="catalog-category-previous" class="catalog-category-arrow catalog-category-arrow--previous" type="button" aria-label="Previous game categories" aria-controls="catalog-categories" disabled hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg></button>
        <button id="catalog-category-next" class="catalog-category-arrow catalog-category-arrow--next" type="button" aria-label="Next game categories" aria-controls="catalog-categories" disabled hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m10 6 6 6-6 6"/></svg></button>
      </div>
    </section>
    <div id="catalog-shelves" class="catalog-shelves" lang="en" dir="ltr"></div>
    <p id="catalog-empty" class="catalog-empty" role="status" lang="en" dir="ltr" hidden>No games found. Try another category or provider.</p>
    <div class="catalog-more-wrap"><button id="catalog-more" class="text-control" type="button" hidden>Show more</button></div>
  </main>
  <main class="game-view" id="game-view" aria-label="Game demo" tabindex="-1" lang="en" dir="ltr" hidden>
    <div class="game-frame-host" id="game-frame-host"></div>
    <div class="game-loading" id="game-loading" hidden>
      <div class="game-loading__content">
        <p class="game-load-status" id="game-load-status" role="status" aria-live="polite">Loading game…</p>
        <button class="game-loading__reveal" id="game-loading-reveal" type="button" hidden>Show game window</button>
      </div>
    </div>
  </main>
  <dialog id="wallet-dialog" class="wallet-dialog" aria-labelledby="wallet-dialog-title" lang="en" dir="ltr">
    <form method="dialog">
      <header class="wallet-dialog__header">
        <h2 id="wallet-dialog-title">Demo wallet</h2>
        <button id="wallet-close" class="icon-button" value="close" aria-label="Close wallet" type="submit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
      </header>
    </form>
    <p class="wallet-dialog__note">Demo balances for this prototype. Game demos use their own balance.</p>
    <div id="wallet-balances" class="wallet-balances">
      <button class="wallet-balance-row" type="button" data-wallet-currency="GC" aria-pressed="true"><span class="coin-badge coin-badge--gc" aria-hidden="true">G</span><span class="wallet-balance-row__name">Gold Coins<span>GC</span></span><strong id="wallet-gc-total">125,000</strong></button>
      <button class="wallet-balance-row" type="button" data-wallet-currency="SC" aria-pressed="false"><span class="coin-badge coin-badge--sc" aria-hidden="true">S</span><span class="wallet-balance-row__name">Sweeps Coins<span>SC</span></span><strong id="wallet-sc-total">15.00</strong></button>
    </div>
    <button id="wallet-add-credit" type="button" class="wallet-credit">Add 1,000 GC</button>
    <p id="wallet-status" role="status" aria-live="polite" class="wallet-status"></p>
  </dialog>
  <script type="module" src="app.js"></script>
</body>
</html>
