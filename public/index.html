  <style id="app-loader-styles">
    body:is([data-app-state="loading"], [data-app-state="error"]) > :not(#app-loader) { visibility: hidden; }
    .app-loader { position: fixed; z-index: 1000; inset: 0; display: grid; place-content: center; justify-items: center; gap: 1.5rem; padding: 1.5rem; background: #000; color: #eeeef2; text-align: center; touch-action: none; }
    .app-loader[hidden] { display: none !important; }
    .app-loader__brand { --app-loader-duration: 1800ms; width: min(7.5rem, calc(100vw - 3rem)); aspect-ratio: 782 / 373; }
    .app-loader__brand > svg { display: block; width: 100%; height: 100%; }
    .app-loader__base { opacity: .24; }
    .app-loader__orbit { stroke-dasharray: .78125 99.21875; animation: app-loader-orbit var(--app-loader-duration) linear infinite; }
    .app-loader__brand[data-paused="true"] .app-loader__orbit { animation-play-state: paused; }
    .app-loader__brand[data-reduced="true"] .app-loader__orbit { display: none; }
    .app-loader__brand[data-reduced="true"] .app-loader__base { opacity: 1; }
    .app-loader__message { margin: 0; color: #9b9ba5; font: .875rem Arial, sans-serif; }
    .app-loader__retry { min-height: 2.75rem; padding: .625rem 1.25rem; border: 0; border-radius: .5rem; background: #20212a; color: #eeeef2; font-weight: 700; cursor: pointer; }
    @keyframes app-loader-orbit { from { stroke-dashoffset: calc(var(--offset) * 1px); } to { stroke-dashoffset: calc(var(--offset) * 1px - 100px); } }
    @media (prefers-reduced-motion: reduce) {
      .app-loader__orbit { display: none; }
      .app-loader__base { opacity: 1; }
    }
  </style>

        <button id="menu-buy" class="site-menu__shortcut site-menu__shortcut--buy" type="button" aria-label="BUY" data-tooltip="BUY"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M20 4H4v2h16V4Zm1 10v-2l-1-5H4l-1 5v2h1v6h10v-6h4v6h2v-6h1Zm-9 4H6v-4h6v4Z"/></svg><span class="site-menu__shortcut-label">BUY</span></button>
        <button id="menu-redeem" class="site-menu__shortcut" type="button" aria-label="REDEEM" data-tooltip="REDEEM" disabled><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M5 4h14a2 2 0 0 1 2 2v13H3V6a2 2 0 0 1 2-2Zm1 3v3h12V7H6Zm2 6H6v3h2v-3Zm5 0h-2v3h2v-3Zm5 0h-2v3h2v-3Z"/></svg><span class="site-menu__shortcut-label">REDEEM</span></button>
      </div>
    </div>
    <div id="menu-content" class="site-menu__scroll">
      <button id="menu-search" class="site-menu__search" type="button" aria-label="Search games" data-tooltip="Search" aria-controls="lobby-view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><span class="site-menu__label">Search</span></button>
      <button id="menu-daily-bonus" class="site-menu__daily" type="button" aria-label="Daily Bonus" data-tooltip="Daily Bonus" aria-controls="feature-view">
        <span class="site-menu__daily-art" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none"><path d="M8 24h32v18H8z" fill="currentColor" opacity=".3"/><path d="M5 17h38v10H5z" fill="currentColor"/><path d="M21 17h6v25h-6z" fill="currentColor"/><path d="M24 17C9 17 9 5 16 6c5 0 8 11 8 11Zm0 0C39 17 39 5 32 6c-5 0-8 11-8 11Z" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/></svg></span>
        <span class="site-menu__daily-copy"><strong id="menu-daily-amount">1,000 GC</strong><span>Daily Bonus</span></span>
        <span id="menu-daily-badge" class="site-menu__daily-badge">Ready</span>
      </button>
      <nav id="menu-navigation" class="site-menu__navigation" aria-label="Casino navigation"></nav>
    </div>
  </dialog>
  <div id="menu-tooltip" class="site-menu__tooltip" role="tooltip" hidden></div>
  <main id="store-view" class="page-content store-view" lang="en" dir="ltr" hidden>
    <h1 class="visually-hidden" tabindex="-1">Store</h1>
    <ul id="store-packages" class="store-packages" aria-label="Gold Coins packages"></ul>
    <dialog id="store-package-dialog" class="store-package-dialog" aria-labelledby="store-package-title" aria-describedby="store-package-note">
      <form method="dialog"><header><h2 id="store-package-title">Package details</h2><button class="store-package-close icon-button" type="submit" aria-label="Close package details"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.4 4.8 12 10.4l5.6-5.6 1.6 1.6L13.6 12l5.6 5.6-1.6 1.6L12 13.6l-5.6 5.6-1.6-1.6L10.4 12 4.8 6.4Z"/></svg></button></header></form>
      <div id="store-package-details"></div>
      <p id="store-package-note" class="store-preview-note">Package preview only. Purchases are not available yet.</p>
    </dialog>
  </main>
  <main id="feature-view" class="page-content feature-view" lang="en" dir="ltr" hidden>
    <header id="feature-header" class="feature-header">
      <button id="feature-back" class="icon-button feature-back" type="button" aria-label="Back to lobby"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m15 4-8 8 8 8 1.4-1.4L9.8 12l6.6-6.6L15 4Z"/></svg></button>
      <div><h1 id="feature-title" tabindex="-1"></h1></div>
    </header>
    <div id="feature-content"></div>
    <p id="feature-status" class="feature-status" role="status" aria-live="polite" aria-atomic="true"></p>
  </main>
  <dialog id="how-to-play-dialog" class="how-to-play-dialog" aria-labelledby="how-to-play-title" aria-describedby="how-to-play-description" lang="en" dir="ltr">
    <button id="how-to-play-close" class="how-to-play-close icon-button" type="button" aria-label="Close How to Play" autofocus><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m6.4 4.8 5.6 5.6 5.6-5.6 1.6 1.6-5.6 5.6 5.6 5.6-1.6 1.6-5.6-5.6-5.6 5.6-1.6-1.6 5.6-5.6-5.6-5.6Z"/></svg></button>
    <h2 id="how-to-play-title">How to Play?</h2>
    <p id="how-to-play-mode" class="how-to-play-mode"></p>
    <div class="how-to-play-stage">
      <button id="how-to-play-previous" class="how-to-play-arrow how-to-play-arrow--previous icon-button" type="button" aria-label="Previous explanation"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m15 4-8 8 8 8"/></svg></button>
      <div id="how-to-play-art" class="how-to-play-art" aria-hidden="true"></div>
      <button id="how-to-play-next" class="how-to-play-arrow how-to-play-arrow--next icon-button" type="button" aria-label="Next explanation"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m9 4 8 8-8 8"/></svg></button>
    </div>
    <p id="how-to-play-description" class="how-to-play-description" aria-live="polite" aria-atomic="true"></p>
    <button id="how-to-play-finish" class="how-to-play-finish" type="button" hidden>Back to Lobby</button>
    <p id="how-to-play-step" class="visually-hidden" role="status"></p>
  </dialog>
  <script type="module" src="bootstrap.js"></script>
</body>
</html>
