<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="application-name" content="LuckyLoop Casino">
  <meta name="description" content="LuckyLoop Casino — a casino lobby prototype with provider catalogs, game collections, and a two-currency demo wallet.">
  <title>LuckyLoop Casino</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="wallet.css">
</head>
<body>
  <header class="top-bar" aria-label="בר עליון">
    <div class="top-bar__inner" lang="en" dir="ltr">
      <div class="header-context">
        <button class="icon-button game-back" id="back-to-lobby" type="button" aria-label="Back to lobby" hidden>
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M15.7 4.3a1 1 0 0 1 0 1.4L9.4 12l6.3 6.3a1 1 0 0 1-1.4 1.4l-7-7a1 1 0 0 1 0-1.4l7-7a1 1 0 0 1 1.4 0Z"/></svg>
        </button>
      </div>
      <div id="coin-wallet" class="coin-wallet" data-currency="GC" aria-label="Demo wallet" role="group">
        <span class="wallet-balance-copy"><span id="wallet-currency-label">GC</span><strong id="wallet-balance-value">125,000</strong></span>
        <button id="wallet-add" class="icon-button" type="button" aria-label="Add demo coins" aria-haspopup="dialog" aria-expanded="false" aria-controls="wallet-dialog"><img id="wallet-add-art" src="assets/coins/add-gold.svg" width="48" height="48" alt="" aria-hidden="true"></button>
      </div>
      <button id="coin-type-switch" class="wallet-switch" type="button" role="switch" aria-label="Use Sweeps Coins" aria-checked="false"><img id="currency-coin" class="coin-art" src="assets/coins/gold-coin.svg" width="36" height="36" alt="" aria-hidden="true"></button>
    </div>
  </header>
  <main class="page-content" id="lobby-view">
    <section class="hero" aria-label="מקום לתמונת הירו"></section>
    <section class="promo-rail" aria-label="מבצעים ואירועים">
      <ul class="promo-rail__list">
        <li class="promo-shortcut">
          <span class="promo-shortcut__art" aria-hidden="true"></span>
          <span class="promo-shortcut__label">Promo 01</span>
        </li>
        <li class="promo-shortcut">
          <span class="promo-shortcut__art" aria-hidden="true"></span>
          <span class="promo-shortcut__label">Promo 02</span>
        </li>
        <li class="promo-shortcut">
          <span class="promo-shortcut__art" aria-hidden="true"></span>
          <span class="promo-shortcut__label">Promo 03</span>
        </li>
        <li class="promo-shortcut">
          <span class="promo-shortcut__art" aria-hidden="true"></span>
          <span class="promo-shortcut__label">Promo 04</span>
        </li>
        <li class="promo-shortcut">
          <span class="promo-shortcut__art" aria-hidden="true"></span>
          <span class="promo-shortcut__label">Promo 05</span>
        </li>
        <li class="promo-shortcut">
          <span class="promo-shortcut__art" aria-hidden="true"></span>
          <span class="promo-shortcut__label">Promo 06</span>
        </li>
      </ul>
    </section>
    <section class="catalog-toolbar" aria-label="Game filters" lang="en" dir="ltr">
      <div class="catalog-category-rail">
        <nav id="catalog-categories" class="catalog-categories" aria-label="Game types and categories"></nav>
        <button id="catalog-category-previous" class="catalog-category-arrow catalog-category-arrow--previous" type="button" aria-label="Previous game categories" aria-controls="catalog-categories" disabled hidden><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M15.7 4.3a1 1 0 0 1 0 1.4L9.4 12l6.3 6.3a1 1 0 0 1-1.4 1.4l-7-7a1 1 0 0 1 0-1.4l7-7a1 1 0 0 1 1.4 0Z"/></svg></button>
        <button id="catalog-category-next" class="catalog-category-arrow catalog-category-arrow--next" type="button" aria-label="Next game categories" aria-controls="catalog-categories" disabled hidden><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M15.7 4.3a1 1 0 0 1 0 1.4L9.4 12l6.3 6.3a1 1 0 0 1-1.4 1.4l-7-7a1 1 0 0 1 0-1.4l7-7a1 1 0 0 1 1.4 0Z" transform="translate(24 0) scale(-1 1)"/></svg></button>
      </div>
    </section>
    <div id="catalog-shelves" class="catalog-shelves" lang="en" dir="ltr"></div>
    <p id="catalog-empty" class="catalog-empty" role="status" lang="en" dir="ltr" hidden>No games found. Try another category or provider.</p>
    <div class="catalog-more-wrap"><button id="catalog-more" class="text-control" type="button" hidden>Show more</button></div>
  </main>
  <main class="game-view" id="game-view" aria-label="Game demo" tabindex="-1" lang="en" dir="ltr" hidden>
    <div class="game-frame-host" id="game-frame-host"></div>
    <div class="game-loading" id="game-loading" hidden>
      <div class="game-loading__content">
        <p class="game-load-status" id="game-load-status" role="status" aria-live="polite">Loading game…</p>
        <button class="game-loading__reveal" id="game-loading-reveal" type="button" hidden>Show game window</button>
      </div>
    </div>
  </main>
  <dialog id="wallet-dialog" class="wallet-dialog" aria-labelledby="wallet-dialog-title" lang="en" dir="ltr">
    <form method="dialog">
      <header class="wallet-dialog__header">
        <div class="wallet-dialog__heading"><span class="wallet-dialog__brand">LuckyLoop Casino</span><h2 id="wallet-dialog-title">Demo wallet</h2></div>
        <button id="wallet-close" class="icon-button" value="close" aria-label="Close wallet" type="submit"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.4 4.8 12 10.4l5.6-5.6 1.6 1.6L13.6 12l5.6 5.6-1.6 1.6L12 13.6l-5.6 5.6-1.6-1.6L10.4 12 4.8 6.4Z"/></svg></button>
      </header>
    </form>
    <p class="wallet-dialog__note">Demo balances for this prototype. Game demos use their own balance.</p>
    <div id="wallet-balances" class="wallet-balances">
      <button class="wallet-balance-row" type="button" data-wallet-currency="GC" aria-pressed="true"><img class="coin-art" src="assets/coins/gold-coin.svg" width="44" height="44" alt="" aria-hidden="true"><span class="wallet-balance-row__name">Gold Coins<span>GC</span></span><strong id="wallet-gc-total">125,000</strong></button>
      <button class="wallet-balance-row" type="button" data-wallet-currency="SC" aria-pressed="false"><img class="coin-art" src="assets/coins/sweeps-coin.svg" width="44" height="44" alt="" aria-hidden="true"><span class="wallet-balance-row__name">Sweeps Coins<span>SC</span></span><strong id="wallet-sc-total">15.00</strong></button>
    </div>
    <button id="wallet-add-credit" type="button" class="wallet-credit">Add 1,000 GC</button>
    <p id="wallet-status" role="status" aria-live="polite" class="wallet-status"></p>
  </dialog>
  <script type="module" src="app.js"></script>
</body>
</html>
